name: Build desktop packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Test application
        run: python -m unittest discover -s tests -v
      - name: Build Windows package
        shell: powershell
        run: ./packaging/build_windows.ps1
      - name: Verify executable, icon, and shortcut
        shell: powershell
        run: ./packaging/verify_windows.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-package
          path: dist/WebcamCapture-Windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 libgl1 libopengl0 libpulse0 libpipewire-0.3-0 desktop-file-utils
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Test application
        run: python -m unittest discover -s tests -v
      - name: Build and verify Linux packages
        run: bash packaging/build_linux.sh
      - name: Verify Linux desktop shortcut
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/shortcut-config"
          mkdir -p "$XDG_CONFIG_HOME" "$RUNNER_TEMP/test-desktop"
          printf 'XDG_DESKTOP_DIR="%s"\n' "$RUNNER_TEMP/test-desktop" > "$XDG_CONFIG_HOME/user-dirs.dirs"
          dist/linux-portable/WebcamCapture/create-desktop-shortcut.sh
          desktop-file-validate "$RUNNER_TEMP/test-desktop/webcam_capture.desktop"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-packages
          path: |
            dist/WebcamCapture-Linux-x86_64.AppImage
            dist/WebcamCapture-Linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cd packages
          sha256sum WebcamCapture-Windows-x64.zip WebcamCapture-Linux-x86_64.AppImage WebcamCapture-Linux-x86_64.tar.gz > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Windows: extract the ZIP, then run Create-Desktop-Shortcut.cmd to add the app and its icon to your desktop.
          Linux: use the AppImage, or extract the portable TAR.GZ and run create-desktop-shortcut.sh. Packages target Intel/AMD 64-bit systems; Linux requires glibc 2.35 or newer.
          Python is included. Compression is applied only during JPEG export.
          Space captures only while the app window is active, except when typing in text fields.
          Successful exports open the saved image folder and clear the photo list. The last export directory is remembered between launches.
          The bookmark panel saves named directories and fills the Directory field with one click. Export names and behavior are unchanged.
          Escape deselects fields and returns focus to capture; it also cancels an unfinished bookmark.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" WebcamCapture-Windows-x64.zip WebcamCapture-Linux-x86_64.AppImage WebcamCapture-Linux-x86_64.tar.gz SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "Webcam Capture $RELEASE_TAG" --notes-file release-notes.md WebcamCapture-Windows-x64.zip WebcamCapture-Linux-x86_64.AppImage WebcamCapture-Linux-x86_64.tar.gz SHA256SUMS.txt
          fi
